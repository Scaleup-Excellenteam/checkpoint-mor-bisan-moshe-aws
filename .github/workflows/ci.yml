name: CI

# Trigger: every push and pull request. Steps: install, compile check, offline
# test suite (fakes for model/provider; no secrets needed), offline security
# smoke, and a Docker image build with a /health probe.
on:
  push:
  pull_request:

jobs:
  test:
    name: Compile and test (Python ${{ matrix.python }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.12"]
    env:
      PYTHON_DOTENV_DISABLED: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Compile check
        run: python -m compileall -q chat_system server.py client.py cli.py tests scripts
      - name: Unit and integration tests
        run: python -m pytest -q -p no:cacheprovider
      - name: Offline security smoke (real server, fake model/provider)
        run: python scripts/security_smoke.py

  ui-e2e:
    name: Web UI browser end-to-end (Playwright)
    runs-on: ubuntu-latest
    needs: test
    env:
      PYTHON_DOTENV_DISABLED: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies and Playwright Chromium
        run: |
          python -m pip install -r requirements.txt playwright
          python -m playwright install --with-deps chromium
      - name: Browser scenario (two clients, DLP/Anti-Bot verdicts, disconnect/reconnect)
        run: python -m pytest -q -p no:cacheprovider tests/test_web_ui_browser.py

  docker:
    name: Docker image builds and answers /health
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: docker build -t tspo-chat:ci .
      - name: Start container and probe /health and /
        run: |
          docker run -d --name tspo -p 8000:8000 tspo-chat:ci
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8000/health; then break; fi
            sleep 1
          done
          curl -fsS http://127.0.0.1:8000/health | grep -q '"ok":true'
          curl -fsS http://127.0.0.1:8000/ | grep -q "TSPO Secret Slice Chat"
      - name: Container logs
        if: always()
        run: docker logs tspo || true
      - name: Stop container
        if: always()
        run: docker rm -f tspo || true
